name: 能力 / 参数建议
description: 提出新的能力、参数或方案迭代建议
title: "feat(<scope>): "
labels: ["enhancement"]
body:
  - type: input
    id: scope
    attributes:
      label: 影响 scope
      placeholder: "prosody / style / control / eval / ..."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / 动机
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: "若涉及新参数，请说明它属于五层 VoiceSpec 的哪一层、与现有参数的冲突关系、如何做单调性验证"
  - type: textarea
    id: refs
    attributes:
      label: 依据
      description: "论文请带 arXiv ID；方案章节；或门禁报告 ID"
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已确认该建议不与「禁止商业化」许可定位冲突
          required: true
        - label: 已确认不引入未经核验的第三方许可证
          required: true
